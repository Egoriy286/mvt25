[project]
name = "mvt25"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Егорий", email = "egoriylm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "debugpy>=1.8.22",
    "gmsh>=4.15.2",
    "h5py>=3.16.0",
    "ipykernel>=7.4.0",
    "ipython>=9.18.1",
    "jupyterlab>=4.6.6",
    "keras>=3.15.1",
    "matplotlib>=3.11.2",
    "meshio>=5.3.5",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.20.0",
    "tqdm>=4.70.1",
]

[project.scripts]
mvt25 = "mvt25:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "ArtificialIntelligence/laba4",
]
